<script>
(function(){
/* ===== A. Données : constantes, bruit, textures, blocs, objets ===== */
var W=224,D=224,H=64,CS=16,NCX=W/CS,NCZ=D/CS,SEA=22;
function clamp(v,a,b){return v<a?a:v>b?b:v}
function rng(s){s=s|0;return function(){s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h|0}
var seed=1;
function hash(x,y,z){var h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(z|0,1274126177)^Math.imul(seed,2246822519);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function sm(t){return t*t*(3-2*t)}
function lerp(a,b,t){return a+(b-a)*t}
function vn2(x,z){var xi=Math.floor(x),zi=Math.floor(z),u=sm(x-xi),v=sm(z-zi);
  return lerp(lerp(hash(xi,0,zi),hash(xi+1,0,zi),u),lerp(hash(xi,0,zi+1),hash(xi+1,0,zi+1),u),v)}
function vn3(x,y,z){var xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),u=sm(x-xi),v=sm(y-yi),w=sm(z-zi);
  return lerp(lerp(lerp(hash(xi,yi,zi),hash(xi+1,yi,zi),u),lerp(hash(xi,yi+1,zi),hash(xi+1,yi+1,zi),u),v),
    lerp(lerp(hash(xi,yi,zi+1),hash(xi+1,yi,zi+1),u),lerp(hash(xi,yi+1,zi+1),hash(xi+1,yi+1,zi+1),u),v),w)}
function fbm(x,z,o){var a=1,f=1,s=0,n=0;for(var i=0;i<o;i++){s+=a*vn2(x*f+i*17.3,z*f-i*9.1);n+=a;a*=.5;f*=2}return s/n}

/* ---------- moteur de textures (16x16, dessinées par le code) ---------- */
var ATLAS=256,atlasData=new Uint8ClampedArray(ATLAS*ATLAS*4),TILES={},tileCount=0;
function tile(name,draw){
  var i=tileCount++;TILES[name]=i;
  var px=new Uint8ClampedArray(1024),r=rng(hashStr(name));
  var P={r:r,px:px,
    set:function(x,y,c,a){x=x|0;y=y|0;if(x<0||y<0||x>15||y>15)return;var o=(y*16+x)*4;px[o]=c[0];px[o+1]=c[1];px[o+2]=c[2];px[o+3]=a===undefined?250:a},
    get:function(x,y){var o=(y*16+x)*4;return[px[o],px[o+1],px[o+2],px[o+3]]}};
  draw(P);
  var tx=(i%16)*16,ty=Math.floor(i/16)*16;
  for(var y=0;y<16;y++)for(var x=0;x<16;x++){var s=(y*16+x)*4,d=((ty+y)*ATLAS+tx+x)*4;atlasData[d]=px[s];atlasData[d+1]=px[s+1];atlasData[d+2]=px[s+2];atlasData[d+3]=px[s+3]}
  return i;
}
function J(c,a,r){var v=(r()-.5)*a;return[c[0]+v,c[1]+v,c[2]+v]}
function SH(c,d){return[c[0]+d,c[1]+d,c[2]+d]}
function fill(P,c,a){for(var y=0;y<16;y++)for(var x=0;x<16;x++)P.set(x,y,J(c,a,P.r))}
function speck(P,c,n,a){for(var k=0;k<n;k++)P.set((P.r()*16)|0,(P.r()*16)|0,J(c,a===undefined?12:a,P.r))}
function blob(P,c,n){for(var k=0;k<n;k++){var x=1+((P.r()*13)|0),y=1+((P.r()*13)|0);P.set(x,y,SH(c,16));P.set(x+1,y,c);P.set(x,y+1,SH(c,-20));if(P.r()<.7)P.set(x+1,y+1,SH(c,-6))}}
function vor(P,c,n,edge,amt){
  var pts=[],k,x,y;for(k=0;k<n;k++)pts.push([P.r()*16,P.r()*16,(P.r()-.5)*amt]);
  for(y=0;y<16;y++)for(x=0;x<16;x++){
    var d1=99,d2=99,i1=0;
    for(k=0;k<n;k++){var dx=Math.abs(x+.5-pts[k][0]);dx=Math.min(dx,16-dx);var dy=Math.abs(y+.5-pts[k][1]);dy=Math.min(dy,16-dy);var d=Math.sqrt(dx*dx+dy*dy);
      if(d<d1){d2=d1;d1=d;i1=k}else if(d<d2)d2=d}
    var col=SH(c,pts[i1][2]);if(d2-d1<edge)col=SH(col,-42);P.set(x,y,col);
  }
}
function bricks(P,brick,mortar,bh,bw,amt,stag){
  for(var y=0;y<16;y++){var row=Math.floor(y/bh),off=stag?(row%2)*(bw/2):0;
    for(var x=0;x<16;x++){var m=(y%bh===bh-1)||(((x+off)%bw)===bw-1);P.set(x,y,m?J(mortar,10,P.r):J(brick,amt,P.r))}}
}

  if(seam)col=SH(col,-30);else if(joint)col=SH(col,-20);P.set(x,y,col)}})}
function logSide(name,bark,birch){return tile(name,function(P){for(var y=0;y<16;y++)for(var x=0;x<16;x++){
  var col=J(bark,16,P.r);if(x%4===0||x%5===2)col=SH(col,-20);P.set(x,y,col)}
  if(birch)for(var k=0;k<7;k++){var bx=(P.r()*13)|0,by=(P.r()*15)|0;for(var l=0;l<3;l++)P.set(bx+l,by,[40,40,38])}})}
function logTop(name,bark,ring){return tile(name,function(P){for(var y=0;y<16;y++)for(var x=0;x<16;x++){
  var d=Math.max(Math.abs(x-7.5),Math.abs(y-7.5)),col;
  if(d>=6.5)col=J(bark,14,P.r);else col=J(ring,10,P.r),col=Math.floor(d)%2?SH(col,-18):col;P.set(x,y,col)}})}
function oreTile(name,base,ore,n){return tile(name,function(P){fill(P,base,18);speck(P,SH(base,-28),7,10);blob(P,ore,n||6)})}
function flatTile(name,c,a){return tile(name,function(P){fill(P,c,a===undefined?10:a)})}

}

    else if(IT[s.id]&&IT[s.id].kind==='armor'&&armor[ARMOR_SLOTS.indexOf(IT[s.id].slot)]===null){armor[ARMOR_SLOTS.indexOf(IT[s.id].slot)]=s;arr[i]=null;refreshAll();return}
    else{dst=slots;if(i<9){from=9;to=36}else{from=0;to=9}}
    var rest=addToArr(dst,from,to,s.id,s.n,s.d);
    if(rest<=0)arr[i]=null;else s.n=rest;
    refreshAll();return;
  }
  if(!cur){
    if(!s)return;
    if(btn===2&&s.n>1){var h=Math.ceil(s.n/2);cur={id:s.id,n:h,d:s.d};s.n-=h}
    else{cur=s;arr[i]=null}
  }else if(name==='armor'&&!armorOK(cur,i)){toast('Ne va pas à cet emplacement');return}
  else if(!s){
    if(btn===2){arr[i]={id:cur.id,n:1,d:cur.d};cur.n--;if(cur.n<=0)cur=null}
    else{arr[i]=cur;cur=null}
  }else if(s.id===cur.id&&stackOf(s.id)>1){
    var room=stackOf(s.id)-s.n,mv=btn===2?Math.min(1,room):Math.min(room,cur.n);
    s.n+=mv;cur.n-=mv;if(cur.n<=0)cur=null;
  }else if(btn!==2){
    if(name==='armor'&&!armorOK(cur,i))return;

  }
  refreshAll();
}
function craft(ri,all){
  var r=RECIPES[ri],tb=nearStation(ID.crafting),fu=nearStation(ID.furnace);
  if(r.st==='table'&&!tb){toast('Il faut un établi à proximité');return}
  if(r.st==='furnace'&&!fu){toast('Il faut un fourneau à proximité');return}
  var made=0,guard=all?64:1;
  while(guard-->0){
    var ok=true;r.ins.forEach(function(g){if(countIng(g)<g[1])ok=false});if(!ok)break;
    if(r.st==='furnace'){
      if(fuelBuf<1){
        var best=-1,bv=1e9;for(var i=0;i<36;i++){var s=slots[i];if(s&&FUEL[s.id]&&FUEL[s.id]>=1&&FUEL[s.id]<bv){bv=FUEL[s.id];best=i}}
        if(best<0)for(var j=0;j<36;j++){var s2=slots[j];if(s2&&FUEL[s2.id]){best=j;break}}
        if(best<0){toast('Il faut du combustible (charbon, planches…)');break}
        fuelBuf+=FUEL[slots[best].id];takeId(slots[best].id,1);
      }
      fuelBuf-=1;
    }
    r.ins.forEach(takeIng);
    var rest=addToArr(slots,0,36,r.out,r.n,0);if(rest>0)spawnDrop(r.out,rest,P.pos.x,P.pos.y+1,P.pos.z);
    made++;
  }
  if(made){snd('craft');refreshAll()}
}

function replaceable(id){var b=BL[id];return id===0||b.liq>0||(b.cross&&/^(tall_grass|fern|dead_bush)$/.test(b.key))}
function useItem(){
  if(!blockHit||mobHit&&!blockHit){}
  var held=slots[sel],hb=blockHit&&!mobHit?blockHit:null;
  if(hb){
    var k=BL[hb.id].key;
    if(k==='crafting'||k==='furnace'){openPanel('inv');return}
    if(k==='bed'){var sn=Math.sin(timeOfDay/DAYLEN*6.283);if(sn>.1){toast('Tu ne peux dormir que la nuit')}else{timeOfDay=DAYLEN*.03;spawn.x=hb.x+.5;spawn.y=hb.y+1.01;spawn.z=hb.z+.5;mobs.filter(function(m){return isHostile(m)}).forEach(killMob);toast('Bonne nuit ! Point de réapparition défini');P.hp=Math.min(20,P.hp+6)}return}
    if(k==='chest'){var key=(hb.x+OX)+','+hb.y+','+(hb.z+OZ);if(!chests[key])chests[key]=new Array(27).fill(null);openPanel('chest',key);return}
  }
  if(!held)return;

  if(id===ITID.seau||id===ITID.seau_eau||id===ITID.seau_lave){
    var o={x:P.pos.x,y:P.pos.y+1.62,z:P.pos.z},lh=raycast(o,lookDir(),reach(),true);if(!lh)return;
    if(id===ITID.seau){

      return;
    }
    var bx=lh.x,by=lh.y,bz=lh.z;if(!BL[lh.id].liq&&!(BL[lh.id].cross&&replaceable(lh.id))){bx+=lh.n[0];by+=lh.n[1];bz+=lh.n[2]}
    if(!replaceable(get(bx,by,bz)))return;
    uSet(bx,by,bz,id===ITID.seau_eau?ID.water:ID.lava);snd('splash');
    if(mode==='survie'){slots[sel]={id:ITID.seau,n:1,d:0};refreshAll()}
    return;
  }
  if(id>=300){
    var it=IT[id];
    if(it.food&&mode==='survie'&&P.hunger<20&&eatT<=0){P.hunger=Math.min(20,P.hunger+it.food);snd('eat');held.n--;if(held.n<=0)slots[sel]=null;eatT=.5;refreshAll();return}
    if(it.kind==='armor'){var ai=ARMOR_SLOTS.indexOf(it.slot),old=armor[ai];armor[ai]=held;slots[sel]=old;refreshAll();toast(it.n+' équipé');return}
    if(it.tt==='hoe'&&hb){var tk=BL[hb.id].key;if((tk==='grass'||tk==='dirt'||tk==='podzol'||tk==='coarse')&&get(hb.x,hb.y+1,hb.z)===0){uSet(hb.x,hb.y,hb.z,ID.farmland);if(mode==='survie')useTool(1)}return}
    if(it.key==='graines'&&hb&&BL[hb.id].key==='farmland'&&get(hb.x,hb.y+1,hb.z)===0){
      uSet(hb.x,hb.y+1,hb.z,ID.wheat0);if(mode==='survie'){held.n--;if(held.n<=0)slots[sel]=null;refreshAll()}}
    return;
  }
  if(!hb)return;
  var px=hb.x,py=hb.y,pz=hb.z;
  if(!(BL[hb.id].cross&&replaceable(hb.id))){px+=hb.n[0];py+=hb.n[1];pz+=hb.n[2]}
  if(py<0||py>=H||px<0||pz<0||px>=W||pz>=D)return;
  if(!replaceable(get(px,py,pz)))return;
  var b=BL[id];
  if(b.full&&hb.n[1]===1&&hb.id===id){uSet(hb.x,hb.y,hb.z,ID[b.full]);snd('place',b);if(mode==='survie'){held.n--;if(held.n<=0)slots[sel]=null;refreshAll()}return}
  if(b.stairOf){var ld=lookDir(),dr=Math.abs(ld.x)>Math.abs(ld.z)?(ld.x>0?0:1):(ld.z>0?2:3);id=ID['stair_'+b.stairOf+'_'+dr];b=BL[id]}
  if(b.solid&&overlapsPlayer(px,py,pz))return;
  if(b.cross&&!supportOK(px,py,pz,b)){return}
  uSet(px,py,pz,id);snd('place',b);
  if(mode==='survie'){held.n--;if(held.n<=0)slots[sel]=null;refreshAll()}
}

/* ---------- sons (synthèse WebAudio) ---------- */
var AC=null,noiseBuf=null,lastPop=0;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();var n=AC.sampleRate,b=AC.createBuffer(1,n,n),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;noiseBuf=b}catch(e){AC=null}
}
function burst(freq,q,dur,vol,type,slide){
  if(!AC)return;var t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;s.playbackRate.value=.8+Math.random()*.4;
  var f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.setValueAtTime(freq,t);if(slide)f.frequency.exponentialRampToValueAtTime(Math.max(40,freq*slide),t+dur);f.Q.value=q;
  var g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t,Math.random()*.4,dur+.05);
}
function tone(f0,f1,dur,vol,type){
  if(!AC)return;var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
function matOf(b){
  if(!b||!b.key)return'stone';var k=b.key;
  if(/^(log_|plank_|crafting|chest|bookshelf)/.test(k))return'wood';
  if(/^(grass|dirt|podzol|mycelium|coarse|farmland|mud|clay|wool_|leaves_|tall_grass|fern|wheat|snow)/.test(k)||b.cross)return'soft';
  if(/^(sand|red_sand|gravel)/.test(k))return'sand';
  if(/^(glass|sglass_|ice|packed_ice|amethyst)/.test(k))return'glass';
  return'stone';
}
var MATSND={stone:[1100,1.1,'bandpass'],wood:[420,1.6,'bandpass'],soft:[700,.5,'lowpass'],sand:[1600,.6,'bandpass'],glass:[3800,4,'bandpass']};
function snd(kind,b){
  if(!AC)return;var m=MATSND[matOf(b)]||MATSND.stone;
  if(kind==='dig')burst(m[0],m[1],.07,.12,m[2]);
  else if(kind==='break'){burst(m[0]*.9,m[1],.17,.3,m[2]);if(matOf(b)==='glass')tone(2400,900,.12,.05,'triangle')}
  else if(kind==='place')burst(m[0]*.75,m[1],.09,.22,m[2]);
  else if(kind==='step')burst(m[0]*.6,m[1],.06,.06,m[2]);
  else if(kind==='hurt'){tone(220,90,.2,.12,'sawtooth');burst(500,.8,.12,.15,'lowpass')}
  else if(kind==='die'){tone(260,50,.7,.14,'sawtooth')}
  else if(kind==='eat'){for(var i=0;i<3;i++)setTimeout(function(){burst(900,1,.05,.14,'bandpass')},i*110)}
  else if(kind==='pop'){var n=performance.now();if(n-lastPop>60){lastPop=n;tone(520+Math.random()*120,900,.07,.06,'sine')}}
  else if(kind==='splash')burst(900,.5,.3,.22,'lowpass',.4);
  else if(kind==='hit'){burst(300,.8,.1,.25,'lowpass');tone(180,80,.08,.08,'square')}
  else if(kind==='craft')tone(480,720,.08,.06,'triangle');
}

  if(document.pointerLockElement)lockErr=0;
  if(!document.pointerLockElement&&running&&!uiOpen&&!dead&&ready&&!isTouch){showMenu('pause')}
});
document.addEventListener('click',function(e){
  var t=e.target;
  audioInit();
  if(t.id==='bMP')showMenu('mp');else if(t.id==='bMPNew')showMenu('mpnew');else if(t.id==='bMPNewS')mpEnter(genCode(),true,'survie');else if(t.id==='bMPNewC')mpEnter(genCode(),true,'creatif');else if(t.id==='bMPJoin')showMenu('mpjoin');else if(t.id==='bMPGoJoin')mpEnter($('mpCode').value,false,'creatif');else if(t.id==='bMPBack2')showMenu('mp');else if(t.id==='pclose')closePanel();else if(t.id==='mpbar')mpShowCode();else if(t.id==='bMPBack')showMenu('title');else if(t.id==='bMPCopy'){try{navigator.clipboard.writeText(mpCode).then(function(){toast('Code copié : '+mpCode)},function(){toast('Code : '+mpCode)})}catch(e){toast('Code : '+mpCode)}}else if(t.id==='bMPGo')startGame('creatif');else if(t.id==='bMPOff')mpLeave();else if(t.id==='bSurvie')startGame('survie');else if(t.id==='bCreatif')startGame('creatif');
  else if(t.id==='bCont'){applySaveState(saved);startGame(saved.mode,true)}
  else if(t.id==='bNewS'||t.id==='bNewC'){lsDel(SAVEKEY);lsSet('cubera_auto',t.id==='bNewS'?'survie':'creatif');location.reload()}
  else if(t.id==='bNew'){if(t.dataset.ok){lsDel(SAVEKEY);lsSet('cubera_auto',mode);started=false;location.reload()}else{t.dataset.ok=1;t.textContent='Confirmer : perdre ce monde ?';t.style.background='#8a2230'}}
  else if(t.id==='bResume'){hideMenu();running=true;tryLock()}
  else if(t.id==='bMode'){mode=mode==='survie'?'creatif':'survie';setMode();hideMenu();running=true;refreshAll();tryLock()}
  else if(t.id==='bLoc'||t.id==='bTp'){doLocate(t.id==='bTp')}
  else if(t.id==='bResp'){respawn();hideMenu();running=true;tryLock()}
  else if(t.id==='bPause'&&running&&!uiOpen){if(document.pointerLockElement)document.exitPointerLock();else showMenu('pause')}
});

/* ---------- entrées ---------- */
var placing=false,lastSpaceT=0;
window.addEventListener('keydown',function(e){
  if(e.target&&e.target.id==='mpCode'){if(e.code==='Enter')mpEnter(e.target.value,false,'creatif');return}
  if(e.target&&e.target.id==='psearch'){if(e.code==='Escape'){e.target.blur();closePanel()}return}
  if(e.repeat&&e.code!=='Space')return;
  keys[e.code]=true;
  if(!ready)return;
  if(e.code==='Escape'){
    if(uiOpen)closePanel();else if(running&&lockFailed||isTouch)showMenu('pause');else if(menuKind==='pause'&&$('menu').classList.contains('show')){hideMenu();running=true;tryLock()}
    return;
  }
  if(!running)return;
  if(e.code==='KeyE'){if(uiOpen)closePanel();else openPanel('inv');e.preventDefault();return}
  if(uiOpen)return;
  if(/^Digit[1-9]$/.test(e.code)){selectSlot(+e.code.slice(5)-1);return}
  if(e.code==='KeyG'){dropHeld(e.ctrlKey)}
  if(e.code==='KeyF'&&mode==='creatif'){P.fly=!P.fly;toast(P.fly?'Vol activé':'Vol désactivé')}
  if(e.code==='Space'){
    e.preventDefault();var now=performance.now();
    if(mode==='creatif'&&now-lastSpaceT<300){P.fly=!P.fly;toast(P.fly?'Vol activé':'Vol désactivé')}
    lastSpaceT=now;
  }
  if(/^Arrow/.test(e.code)||e.code==='Tab')e.preventDefault();
});
window.addEventListener('keyup',function(e){keys[e.code]=false});
window.addEventListener('blur',function(){keys={};mining=false;placing=false});
window.addEventListener('mousemove',function(e){
  if(!running||uiOpen||(!document.pointerLockElement&&!lockFailed))return;
  P.yaw-=e.movementX*.0022*sens;P.pitch=clamp(P.pitch-e.movementY*.0022*sens,-1.55,1.55);
});
document.addEventListener('input',function(e){
  var t=e.target;if(!t||!t.id)return;
  if(t.id==='sLoc'){locSel=t.selectedIndex;return}if(t.id==='sSens')sens=t.value/100;else if(t.id==='sFov'){baseFov=+t.value}else if(t.id==='sView')viewD=+t.value;else if(t.id==='sBri'){briV=+t.value;applyBri()}else return;
  saveCfg();
});
canvas.addEventListener('mousedown',function(e){
  if(!running||uiOpen||isTouch)return;
  if(!document.pointerLockElement&&!lockFailed){tryLock();audioInit();return}
  if(e.button===1){e.preventDefault();if(mode==='creatif'&&blockHit&&!/^wheat/.test(BL[blockHit.id].key)){var pid=blockHit.id,f=-1;for(var i=0;i<9;i++)if(slots[i]&&slots[i].id===pid){f=i;break}if(f>=0)selectSlot(f);else{slots[sel]={id:pid,n:64,d:0};refreshAll()}}return}
  if(e.button===0)mining=true;
  else if(e.button===2){placing=true;placeT=0}
  e.preventDefault();
});
window.addEventListener('mouseup',function(e){if(e.button===0)mining=false;if(e.button===2)placing=false});
window.addEventListener('contextmenu',function(e){e.preventDefault()});
window.addEventListener('wheel',function(e){if(!running||uiOpen)return;selectSlot(sel+(e.deltaY>0?1:-1))},{passive:true});
window.addEventListener('beforeunload',function(){});

/* tactile */
(function(){
  if(!isTouch)return;
  $('touch').style.display='block';
  var jt=null,lt=null,jc={x:0,y:0},lp={x:0,y:0};
  window.addEventListener('touchstart',function(e){
    if(!running||uiOpen)return;
    for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
      if(t.target.closest&&t.target.closest('.tb,#hotbar,#bPause'))continue;
      if(t.clientX<window.innerWidth*.45&&jt===null){jt=t.identifier;jc={x:t.clientX,y:t.clientY}}
      else if(lt===null){lt=t.identifier;lp={x:t.clientX,y:t.clientY}}
    }
  },{passive:true});
  window.addEventListener('touchmove',function(e){
    if(!running||uiOpen)return;
    for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
      if(t.identifier===jt){joy.x=clamp((t.clientX-jc.x)/50,-1,1);joy.y=clamp(-(t.clientY-jc.y)/50,-1,1)}
      else if(t.identifier===lt){P.yaw-=(t.clientX-lp.x)*.005;P.pitch=clamp(P.pitch-(t.clientY-lp.y)*.005,-1.55,1.55);lp={x:t.clientX,y:t.clientY}}}
    e.preventDefault();
  },{passive:false});
  function end(e){for(var i=0;i<e.changedTouches.length;i++){var id=e.changedTouches[i].identifier;if(id===jt){jt=null;joy.x=joy.y=0}if(id===lt)lt=null}}
  window.addEventListener('touchend',end);window.addEventListener('touchcancel',end);
  function bind(id,dn,up){var el=$(id);el.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();if(running&&!uiOpen)dn()},{passive:false});el.addEventListener('touchend',function(e){e.preventDefault();up&&up()},{passive:false})}
  bind('tbJump',function(){keys.Space=true;var n=performance.now();if(mode==='creatif'&&n-lastSpaceT<300)P.fly=!P.fly;lastSpaceT=n},function(){keys.Space=false});
  bind('tbMine',function(){mining=true},function(){mining=false});
  bind('tbPlace',function(){useItem()},null);
  bind('tbInv',function(){openPanel('inv')},null);
})();

/* ---------- boucle ---------- */
var last=performance.now(),tickT=0,fps=60,fpsN=0,fpsT=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(.05,(now-last)/1000);last=now;
  if(shifting)return;
  if(!ready){renderer.render(scene,camera);return}
  if(running&&started)checkShift();
  if(running){
    if(!isTouch||true){var ay=(keys.ArrowLeft?1:0)-(keys.ArrowRight?1:0),ap=(keys.ArrowUp?1:0)-(keys.ArrowDown?1:0);if(!uiOpen){P.yaw+=ay*2*dt;P.pitch=clamp(P.pitch+ap*1.6*dt,-1.55,1.55)}}
    var day=updateSky(dt);
    if(!uiOpen){updatePlayer(dt)}else{var sv=keys;keys={};updatePlayer(dt);keys=sv}
    updateTarget();
    if(!uiOpen)updateMining(dt);
    eatT-=dt;placeT-=dt;
    if(placing&&!uiOpen&&placeT<=0){var hs=slots[sel];useItem();placeT=(hs&&hs.id<300)?.22:.6}
    updateMobs(dt,U.uSun.value>.9?1:0);spawnLogic(dt,U.uSun.value>.9?1:0);
    updateDrops(dt);updateFalling(dt);updateLeaves(dt);updateWater(dt);mpFrame(dt,now);
    tickT-=dt;if(tickT<=0){tickT=.12;randomTicks()}
    flushDirty(2);
    $('hand').classList.toggle('swing',mining&&!uiOpen);
  }
  var hsp=Math.hypot(P.vel.x,P.vel.z),tf=baseFov+((P.sprinting&&hsp>4&&running)?8:0);fovCur+=(tf-fovCur)*Math.min(1,dt*8);
  if(Math.abs(camera.fov-fovCur)>.05){camera.fov=fovCur;camera.updateProjectionMatrix()}
  if(running&&started){saveT-=dt;if(saveT<=0){saveT=25;saveGame(true)}}
  camera.position.set(P.pos.x,P.pos.y+1.62,P.pos.z);camera.rotation.set(P.pitch,P.yaw,0);
  var eyeL=liqAt(P.pos.x,P.pos.y+1.62,P.pos.z),v=$('veil');v.style.background=eyeL===1?'rgba(20,60,170,.32)':eyeL===2?'rgba(220,70,10,.55)':'transparent';
  fpsN++;if(now-fpsT>500){fps=Math.round(fpsN*1000/(now-fpsT));fpsN=0;fpsT=now}
  updateHud();
  renderer.render(scene,camera);
}

/* ---------- démarrage : génération par étapes ---------- */
/* ---------- fenêtre de monde infinie : on régénère autour du joueur ---------- */
function snap16(v){return Math.floor(v/16)*16}
var locSel=0,locTgt=null,shiftOv=null;
function showOv(on,txt){
  if(!shiftOv){shiftOv=document.createElement('div');shiftOv.style.cssText='position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);background:#0a0c14dd;color:#fff;padding:14px 22px;border-radius:8px;font:600 15px sans-serif;z-index:30;text-align:center;pointer-events:none;display:none';document.body.appendChild(shiftOv)}
  shiftOv.style.display=on?'block':'none';if(txt)shiftOv.textContent=txt;
}
function buildWindow(done){
  var z=0,cz=0,cx=0;
  TRACK=false;
  world.fill(0);hmap.fill(0);biomeMap.fill(0);chunkMax.fill(0);waterQ.clear();lavaQ.clear();fallList=[];leafQueue.length=0;dirtyChunks.clear();
  function terrain(){var end=Math.min(D,z+16);for(;z<end;z++)for(var x=0;x<W;x++)genColumn(x,z);progress(z/D*.4,'Relief et biomes…');if(z<D)setTimeout(terrain,0);else setTimeout(s1,0)}
  function s1(){progress(.45,'Minerais et géodes…');setTimeout(function(){genOres();genGeodes();progress(.55,'Arbres et végétation…');setTimeout(s2,0)},0)}
  function s2(){genTrees();genDecor();progress(.6,'Villages et monuments…');setTimeout(s3,0)}
  function s3(){
    genStructures();
    edits.forEach(function(v,k){var x=wkx(k)-OX,zz=wkz(k)-OZ,y=wky(k);if(x>=0&&zz>=0&&x<W&&zz<D&&y<H)world[x+zz*W+y*W*D]=v});
    recalcChunkMax();progress(.66,'Lumière…');
    setTimeout(function(){initLight();setTimeout(meshing,0)},0);
  }
  function meshing(){
    var n=0;while(cz<NCZ&&n<10){rebuildChunk(cx+cz*NCX);dirtyChunks.delete(cx+cz*NCX);cx++;if(cx>=NCX){cx=0;cz++}n++}
    progress(.7+(cz*NCX+cx)/(NCX*NCZ)*.3,'Construction des chunks…');
    if(cz<NCZ)setTimeout(meshing,0);else{dirtyChunks.clear();TRACK=true;done()}
  }
  terrain();
}
function recenter(wx,wz,done){
  if(shifting)return;
  shifting=true;showOv(true,'Nouvelle zone…');
  var nx=snap16(wx-W/2),nz=snap16(wz-D/2),dx=nx-OX,dz=nz-OZ;
  OX=nx;OZ=nz;blockHit=null;
  var old=progress;progress=function(p,t){showOv(true,'Nouvelle zone… '+Math.round(p*100)+' %')};
  buildWindow(function(){
    progress=old;
    P.pos.x-=dx;P.pos.z-=dz;spawn.x-=dx;spawn.z-=dz;
    mobs.forEach(function(m){m.pos.x-=dx;m.pos.z-=dz});
    drops.forEach(function(e){e.pos.x-=dx;e.pos.z-=dz});
    mpAv.forEach(function(a){a.g.position.x-=dx;a.g.position.z-=dz});
    camera.position.set(P.pos.x,P.pos.y+1.62,P.pos.z);
    shifting=false;showOv(false);
    if(done)done();
  });
}
function checkShift(){
  var M=52,LIM=4000000,wx=P.pos.x+OX,wz=P.pos.z+OZ;
  if(Math.abs(wx)>LIM){P.pos.x=(wx>0?LIM:-LIM)-OX;P.vel.x=0}
  if(Math.abs(wz)>LIM){P.pos.z=(wz>0?LIM:-LIM)-OZ;P.vel.z=0}
  if(P.pos.x<M||P.pos.x>W-M||P.pos.z<M||P.pos.z>D-M)recenter(P.pos.x+OX,P.pos.z+OZ);
}
function locHTML(){
  var o='';STRUCTS.forEach(function(d,i){o+='<option value="'+i+'"'+(i===locSel?' selected':'')+'>'+d.n+'</option>'});
  return '<div class="set"><label>Structure <select id="sLoc">'+o+'</select></label><div class="btns"><button id="bLoc">Localiser</button>'+(mode==='creatif'?'<button id="bTp">Se téléporter</button>':'')+'</div></div>';
}
function locText(wx,wz){
  if(!locTgt)return'';
  var dx=locTgt.x-wx,dz=locTgt.z-wz,d=Math.hypot(dx,dz);
  if(d<20){locTgt=null;return''}
  var th=Math.atan2(-dx,-dz),rel=th-P.yaw;rel=Math.atan2(Math.sin(rel),Math.cos(rel));
  var ar=['↑','↖','←','↙','↓','↘','→','↗'],i=Math.round(rel/(Math.PI/4));if(i<0)i+=8;
  return' · '+ar[i%8]+' '+locTgt.n+' '+Math.round(d)+' m';
}
function doLocate(tp){
  var def=STRUCTS[locSel],px=P.pos.x+OX,pz=P.pos.z+OZ,p=locateStruct(def,px,pz);
  if(!p){toast('Aucune structure « '+def.n+' » trouvée à proximité.');return}
  hideMenu();running=true;tryLock();
  if(tp){
    toast('Téléportation : '+def.n);
    recenter(p.x,p.z,function(){
      var lx=Math.floor(p.x-OX),lz=Math.floor(p.z-OZ),y=H-1;
      while(y>1&&!(BL[get(lx,y,lz)].solid||BL[get(lx,y,lz)].liq))y--;
      P.pos.x=lx+.5;P.pos.z=lz+.5;P.pos.y=y+1.05;P.vel.x=P.vel.y=P.vel.z=0;
    });
  }else{
    locTgt={x:p.x,z:p.z,n:def.n};
    toast(def.n+' à '+Math.round(Math.hypot(p.x-px,p.z-pz))+' blocs (x '+p.x+', z '+p.z+') · flèche en haut à gauche');
  }
}
/* ---------- démarrage ---------- */
function progress(p,txt){var f=$('genfill'),t=$('gentext');if(f)f.style.width=(p*100)+'%';if(t)t.textContent=txt}
function boot(){
  saved=mpOn?null:loadSave();seed=mpOn?codeSeed(mpCode):(saved?saved.seed:((Math.random()*1e9)|0));
  var cwx=0,cwz=0;
  if(saved){cwx=saved.p.x;cwz=saved.p.z;loadSaveEdits(saved)}
  OX=snap16(cwx-W/2);OZ=snap16(cwz-D/2);
  showMenu('title');
  function finish(){
    for(var i=0,tries=0;i<16&&tries<300;tries++){var a=Math.random()*6.283,r=8+Math.random()*40;if(addMob(PASSIVES[(Math.random()*PASSIVES.length)|0],P.pos.x+Math.cos(a)*r,P.pos.z+Math.sin(a)*r))i++}
    ready=true;progress(1,'Prêt');enableStart();mpInit();
    var au=lsGet('cubera_auto');if(au){lsDel('cubera_auto');if(!saved)startGame(au)}
    camera.position.set(P.pos.x,P.pos.y+1.62,P.pos.z);
  }
  buildWindow(function(){
    if(saved)applySaveWorld(saved);else{var sp=findSpawn();spawn.x=sp.x;spawn.y=sp.y;spawn.z=sp.z}
    P.pos.x=spawn.x;P.pos.y=spawn.y;P.pos.z=spawn.z;P.yaw=Math.random()*6.28;
    finish();
  });
}

renderHotbar();updateHud();
requestAnimationFrame(frame);
boot();

if(location.hash==='#debug')window.__ev=function(s){return eval(s)};

window.addEventListener('beforeunload',function(){saveGame(true)});
document.addEventListener('visibilitychange',function(){if(document.hidden)saveGame(true)});
})();
